<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NetHack Map Editor</title>
<style>
  body { background-color: #000; color: #fff; font-family: monospace; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
  #menubar { height: 10%; background: #15202b; padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-x: auto; border-bottom: 1px solid #22303c; }
  .toolbar-row { display: flex; flex-wrap: nowrap; gap: 5px; }
  .toolbar-row button { background: #22303c; color: #1da1f2; border: 1px solid #38444d; padding: 8px 12px; cursor: pointer; font-family: monospace; min-width: 50px; }
  .toolbar-row button.selected { background: #1da1f2; color: #fff; }
  #main { flex: 1; display: flex; }
  #left, #right { flex: 1; margin: 20px; display: flex; flex-direction: column; }
  #grid { 
    position: relative;
    display: grid; 
    grid-template-columns: 50px repeat(76, 16px); 
    grid-template-rows: 24px repeat(20, 20px); 
    background: #111; 
    user-select: none;
    width: fit-content;
    margin: 0 auto;
  }
  #grid > div { 
    text-align: center; 
    line-height: 20px; 
    overflow: hidden;
    position: relative;
  }
  .header { color: #888; font-size: 12px; }
  .cell { 
    cursor: pointer; 
    font-size: 16px; 
    border: 1px solid #222;
  }
  .preview { 
    position: absolute; 
    border: 2px solid rgba(29, 161, 242, 0.6); 
    pointer-events: none; 
    background: rgba(29, 161, 242, 0.1);
    box-sizing: border-box;
  }
  #overlay { 
    position: absolute; 
    top: 24px; left: 50px;
    pointer-events: none;
  }
  #textarea { flex: 1; background: #15202b; color: #fff; border: 1px solid #38444d; font-family: monospace; font-size: 14px; resize: none; }
  #copybtn { margin-top: 10px; padding: 10px; background: #1da1f2; color: #fff; border: none; cursor: pointer; font-size: 16px; }
  #position { text-align: center; color: #1da1f2; margin-top: 10px; font-size: 14px; }
  .error { color: red; margin-top: 10px; }
</style>
</head>
<body>
<div id="menubar">
  <div class="toolbar-row" id="char-row"></div>
  <div class="toolbar-row" id="shape-row"></div>
  <div class="toolbar-row" id="fill-row"></div>
</div>
<div id="main">
  <div id="left">
    <div style="position:relative;">
      <div id="grid"></div>
      <div id="overlay"></div>
    </div>
    <div id="position">Cursor: --,--</div>
  </div>
  <div id="right">
    <textarea id="textarea" spellcheck="false"></textarea>
    <button id="copybtn">Copy to Clipboard</button>
    <div id="errormsg" class="error"></div>
  </div>
</div>

<script>
const ROWS = 20;
const COLS = 76;
const CELL_W = 16;
const CELL_H = 20;

let map = Array.from({length: ROWS}, () => Array(COLS).fill(' '));
let currentChar = ' ';
let currentShape = 'point';
let currentFillMode = 'solid';

let dragStart = null;
let currentHoverX = -1;
let currentHoverY = -1;

const charButtons = [
  {ch: ' ', name: 'Stone / Space'}, {ch: '#', name: 'Corridor'}, {ch: '.', name: 'Room floor'},
  {ch: '-', name: 'Horizontal wall'}, {ch: '|', name: 'Vertical wall'}, {ch: '+', name: 'Door'},
  {ch: 'A', name: 'Air'}, {ch: 'C', name: 'Cloud'}, {ch: 'S', name: 'Secret door'},
  {ch: '{', name: 'Fountain'}, {ch: '\\', name: 'Throne'}, {ch: 'K', name: 'Sink'},
  {ch: '}', name: 'Moat'}, {ch: 'P', name: 'Pool'}, {ch: 'L', name: 'Lava pool'},
  {ch: 'I', name: 'Ice'}, {ch: 'W', name: 'Water'}, {ch: 'T', name: 'Tree'}, {ch: 'F', name: 'Iron bars'},
];

const shapeButtons = [
  {id: 'point', label: 'Point'},
  {id: 'large', label: 'Large 4×4'},
  {id: 'rectangle', label: 'Rectangle'},
  {id: 'triangle', label: 'Triangle'},
  {id: 'circle', label: 'Circle'},
  {id: 'fill', label: 'Fill'},
];

const fillButtons = [
  {id: 'solid', label: 'Solid'},
  {id: 'outline', label: 'Outline'},
];

const charRow = document.getElementById('char-row');
charButtons.forEach(btn => {
  const b = document.createElement('button');
  b.textContent = btn.ch === ' ' ? '[space]' : btn.ch;
  b.title = btn.name;
  b.onclick = () => { charRow.querySelectorAll('button').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); currentChar = btn.ch; };
  charRow.appendChild(b);
});
charRow.firstChild.classList.add('selected');

const shapeRow = document.getElementById('shape-row');
shapeButtons.forEach(btn => {
  const b = document.createElement('button');
  b.textContent = btn.label;
  b.onclick = () => { shapeRow.querySelectorAll('button').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); currentShape = btn.id; clearPreview(); };
  shapeRow.appendChild(b);
});
shapeRow.firstChild.classList.add('selected');

const fillRow = document.getElementById('fill-row');
fillButtons.forEach(btn => {
  const b = document.createElement('button');
  b.textContent = btn.label;
  b.onclick = () => { fillRow.querySelectorAll('button').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); currentFillMode = btn.id; };
  fillRow.appendChild(b);
});
fillRow.firstChild.classList.add('selected');

const grid = document.getElementById('grid');
const overlay = document.getElementById('overlay');
const textarea = document.getElementById('textarea');
const position = document.getElementById('position');
const copybtn = document.getElementById('copybtn');

function createGrid() {
  grid.innerHTML = '';
  overlay.innerHTML = '';
  const corner = document.createElement('div'); corner.className = 'header'; grid.appendChild(corner);
  for (let x = 0; x < COLS; x++) {
    const h = document.createElement('div'); h.textContent = x.toString().padStart(2,'0'); h.className = 'header'; h.title = x; grid.appendChild(h);
  }
  for (let y = 0; y < ROWS; y++) {
    const rh = document.createElement('div'); rh.textContent = y.toString().padStart(2,'0'); rh.className = 'header'; rh.title = y; grid.appendChild(rh);
    for (let x = 0; x < COLS; x++) {
      const cell = document.createElement('div');
      cell.textContent = map[y][x];
      cell.className = 'cell';
      cell.dataset.x = x;
      cell.dataset.y = y;
      grid.appendChild(cell);
    }
  }
}

function updateText() {
  const lines = map.map(row => row.join('')).join('\n');
  textarea.value = `des.map([[\n${lines}\n]]);`;
}

function paint(x, y) {
  if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;
  map[y][x] = currentChar;
  const cell = grid.querySelector(`div[data-x="${x}"][data-y="${y}"]`);
  if (cell) cell.textContent = currentChar;
}

function clearPreview() { overlay.innerHTML = ''; }

function showPreview() {
  clearPreview();
  if (currentShape === 'point' || currentShape === 'fill') return;

  let preview = document.createElement('div');
  preview.className = 'preview';

  if (currentShape === 'large') {
    const left = Math.max(0, currentHoverX - 1) * CELL_W;
    const top = Math.max(0, currentHoverY - 1) * CELL_H;
    preview.style.left = `${left}px`;
    preview.style.top = `${top}px`;
    preview.style.width = `${Math.min(4, COLS - currentHoverX + 2) * CELL_W}px`;
    preview.style.height = `${Math.min(4, ROWS - currentHoverY + 2) * CELL_H}px`;
  } else if (dragStart && ['rectangle','triangle','circle'].includes(currentShape)) {
    const x1 = dragStart.x, y1 = dragStart.y;
    const x2 = currentHoverX, y2 = currentHoverY;
    const left = Math.min(x1, x2) * CELL_W;
    const top = Math.min(y1, y2) * CELL_H;
    const width = (Math.abs(x2 - x1) + 1) * CELL_W;
    const height = (Math.abs(y2 - y1) + 1) * CELL_H;
    preview.style.left = `${left}px`;
    preview.style.top = `${top}px`;
    preview.style.width = `${width}px`;
    preview.style.height = `${height}px`;
    if (currentShape === 'circle') preview.style.borderRadius = '50%';
  }
  overlay.appendChild(preview);
}

function drawRectangle(xmin, xmax, ymin, ymax) {
  if (currentFillMode === 'solid') {
    for (let y = ymin; y <= ymax; y++)
      for (let x = xmin; x <= xmax; x++) paint(x, y);
  } else {
    for (let x = xmin; x <= xmax; x++) { paint(x, ymin); paint(x, ymax); }
    for (let y = ymin + 1; y < ymax; y++) { paint(xmin, y); paint(xmax, y); }
  }
}

function drawCircle(xmin, xmax, ymin, ymax) {
  const cx = (xmin + xmax) / 2;
  const cy = (ymin + ymax) / 2;
  const rx = (xmax - xmin) / 2 + 0.5;
  const ry = (ymax - ymin) / 2 + 0.5;
  if (rx <= 0 || ry <= 0) return;

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const dx = (x - cx) / rx;
      const dy = (y - cy) / ry;
      const dist = dx * dx + dy * dy;
      if (currentFillMode === 'solid') {
        if (dist <= 1) paint(x, y);
      } else {
        if (Math.abs(dist - 1) < 0.35) paint(x, y); // slightly thicker for visibility
      }
    }
  }
}

function drawTriangle(xmin, xmax, ymin, ymax) {
  if (currentFillMode === 'solid') {
    for (let y = ymin; y <= ymax; y++) {
      const t = (y - ymin) / (ymax - ymin || 1);
      const rowX = Math.round(xmin + t * (xmax - xmin));
      for (let x = rowX; x <= xmax; x++) paint(x, y);
    }
  } else { // outline: top, right, hypotenuse
    // top horizontal
    for (let x = xmin; x <= xmax; x++) paint(x, ymin);
    // right vertical
    for (let y = ymin; y <= ymax; y++) paint(xmax, y);
    // hypotenuse (approximate)
    for (let y = ymin; y <= ymax; y++) {
      const t = (y - ymin) / (ymax - ymin || 1);
      const hx = Math.round(xmin + t * (xmax - xmin));
      paint(hx, y);
    }
  }
}

function applyShape(x1, y1, x2, y2) {
  const xmin = Math.max(0, Math.min(x1, x2));
  const xmax = Math.min(COLS - 1, Math.max(x1, x2));
  const ymin = Math.max(0, Math.min(y1, y2));
  const ymax = Math.min(ROWS - 1, Math.max(y1, y2));

  if (xmax < xmin || ymax < ymin) return;

  if (currentShape === 'rectangle') drawRectangle(xmin, xmax, ymin, ymax);
  else if (currentShape === 'circle') drawCircle(xmin, xmax, ymin, ymax);
  else if (currentShape === 'triangle') drawTriangle(xmin, xmax, ymin, ymax);
}
/*
function fillArea(x, y) {
  const target = map[y][x];
  if (target === currentChar) return;
  const queue = [[x, y]];
  const visited = Array.from({length: ROWS}, () => Array(COLS).fill(false));
  while (queue.length) {
    const [cx, cy] = queue.shift();
    if (visited[cy][cx] || map[cy][cx] !== target) continue;
    visited[cy][cx] = true;
    paint(cx, cy);
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dx,dy]) => queue.push([cx+dx, cy+dy]));
  }
}*/
function fillArea(startX, startY) {
  const target = map[startY][startX];
  if (target === currentChar) return;

  const queue = [[startX, startY]];
  const visited = Array.from({length: ROWS}, () => Array(COLS).fill(false));

  while (queue.length) {
    const [cx, cy] = queue.shift();
    if (cx < 0 || cx >= COLS || cy < 0 || cy >= ROWS || visited[cy][cx] || map[cy][cx] !== target) continue;
    visited[cy][cx] = true;
    paint(cx, cy);
    queue.push([cx-1, cy], [cx+1, cy], [cx, cy-1], [cx, cy+1]);
  }
}

let isDragging = false;

grid.addEventListener('mousedown', e => {
  if (!e.target.classList.contains('cell')) return;
  const x = parseInt(e.target.dataset.x);
  const y = parseInt(e.target.dataset.y);
  currentHoverX = x; currentHoverY = y;
  position.textContent = `Cursor: ${x},${y}`;

  if (currentShape === 'fill') { fillArea(x, y); updateText(); return; }

  isDragging = true;
  dragStart = {x, y};

  if (currentShape === 'point') paint(x, y);
  else if (currentShape === 'large') {
    for (let dy = -1; dy <= 2; dy++)
      for (let dx = -1; dx <= 2; dx++)
        paint(x + dx, y + dy);
  }
  updateText();
});

grid.addEventListener('mousemove', e => {
  if (!e.target.classList.contains('cell')) return;
  const x = parseInt(e.target.dataset.x);
  const y = parseInt(e.target.dataset.y);
  currentHoverX = x; currentHoverY = y;
  position.textContent = `Cursor: ${x},${y}`;
  showPreview();

  if (isDragging) {
    if (currentShape === 'point') paint(x, y);
    else if (currentShape === 'large') {
      for (let dy = -1; dy <= 2; dy++)
        for (let dx = -1; dx <= 2; dx++)
          paint(x + dx, y + dy);
    }
  }
});

grid.addEventListener('mouseup', e => {
  if (isDragging && dragStart && ['rectangle','triangle','circle'].includes(currentShape)) {
    const x = parseInt(e.target.dataset.x);
    const y = parseInt(e.target.dataset.y);
    applyShape(dragStart.x, dragStart.y, x, y);
    updateText();
    clearPreview();
  }
  isDragging = false;
  dragStart = null;
});

grid.addEventListener('mouseleave', () => {
  isDragging = false;
  dragStart = null;
  clearPreview();
  position.textContent = 'Cursor: --,--';
});

grid.addEventListener('selectstart', e => e.preventDefault());

copybtn.onclick = () => {
  navigator.clipboard.writeText(textarea.value)
    .then(() => alert('Copied to clipboard!'))
    .catch(() => alert('Copy failed - select and copy manually'));
};

createGrid();
updateText();
</script>
</body>
</html>
