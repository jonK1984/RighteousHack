<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NetHack Map Editor</title>
<style>
  body { background-color: #000; color: #fff; font-family: monospace; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
  #menubar { height: 10%; min-height: 230px; #15202b; padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-x: auto; border-bottom: 1px solid #22303c; }
  .toolbar-row { display: flex; flex-wrap: nowrap; gap: 5px; }
  .toolbar-row button { background: #22303c; color: #1da1f2; border: 1px solid #38444d; padding: 8px 12px; cursor: pointer; font-family: monospace; min-width: 50px; }
  .toolbar-row button.selected { background: #1da1f2; color: #fff; }
  #main { flex: 1; display: flex; }
  #left, #right { flex: 1; margin: 20px; display: flex; flex-direction: column; }
  #grid { 
    position: relative;
    display: grid; 
    grid-template-columns: 50px repeat(76, 16px); 
    grid-template-rows: 24px repeat(20, 20px); 
    background: #111; 
    user-select: none;
    width: fit-content;
    margin: 0 auto;
  }
  #grid > div { 
    text-align: center; 
    line-height: 20px; 
    overflow: hidden;
    position: relative;
  }
  .header { color: #888; font-size: 12px; }
  .cell { 
    cursor: pointer; 
    font-size: 16px; 
    border: 1px solid #222;
  }
  .preview { 
    position: absolute; 
    border: 2px solid rgba(29, 161, 242, 0.6); 
    pointer-events: none; 
    background: rgba(29, 161, 242, 0.1);
    box-sizing: border-box;
  }
  #overlay { 
    position: absolute; 
    top: 24px; left: 50px;
    pointer-events: none;
  }
  #terrain-textarea {
    width: 590px;
    height: 358px;
  }
  #textarea { flex: 1; background: #15202b; color: #fff; border: 1px solid #38444d; font-family: monospace; font-size: 14px; resize: none; }
  #copybtn { margin-top: 10px; padding: 10px; background: #1da1f2; color: #fff; border: none; cursor: pointer; font-size: 16px; }
  #position { text-align: center; color: #1da1f2; margin-top: 10px; font-size: 14px; }
  .error { color: red; margin-top: 10px; }

  .layer-code { 
    margin-top: 20px; 
    border: 1px solid #38444d; 
    padding: 10px; 
    background: #15202b; 
  }
  .layer-code h3 { margin: 0 0 10px 0; font-size: 14px; }
  .layer-code textarea { width: 100%; height: 150px; background: #000; color: #fff; border: none; font-family: monospace; }
  .hide { display: none; }

  /* Popup styling */
  #popup-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
    background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100;
  }
  .popup {
    background: #22303c; padding: 20px; border: 1px solid #1da1f2; width: 650px;
  }
  .popup input, .popup textarea {  margin: 10px 0; background: #000; color: #fff; }
  .popup input[type="text"] {
    width: 100%;
  }
  .popup textarea[name="contents"], .popup textarea[name="inventory"] {
    width: 100%;
  }
  .popup label { display: block; margin-top: 10px; }

  /* ADD THIS TO YOUR <style> BLOCK */
  .mon-popup-layout {
      display: flex;
      gap: 20px;
      width: 100%;
      align-items: flex-start;
  }

  .mon-input-section {
      flex: 1;
      min-width: 300px;
  }

  .mon-scroll-list {
      flex: 0 0 250px;              /* fixed width */
      max-height: 570px;            /* max height of the list – adjusts to content if shorter */
      overflow-y: auto;
      background: #22303c;
      border: 1px solid #1da1f2;
      border-radius: 6px;
      padding: 8px;
      font-size: 14px;
  }

  .mon-scroll-list .mon-item {
      padding: 6px 8px;
      cursor: pointer;
      border-bottom: 1px solid #38444d;
      transition: background 0.2s;
  }

  .mon-scroll-list .mon-item:hover {
      background: #1da1f2;
      color: #000;
  }

  .mon-scroll-list .mon-item:last-child {
      border-bottom: none;
  }

  .mon-scroll-list .mon-item.match {
      display: block;
  }

  .mon-scroll-list .mon-item.no-match {
      display: none;
  }

  /* ADD THIS TO YOUR <style> BLOCK */
  .obj-popup-layout {
      display: flex;
      gap: 20px;
      width: 100%;
      align-items: flex-start;
  }

  .obj-input-section {
      flex: 1;
      min-width: 300px;
  }

  .obj-scroll-list {
      flex: 0 0 300px;              /* slightly wider than monster list */
      max-height: 650px;
      overflow-y: auto;
      background: #22303c;
      border: 1px solid #1da1f2;
      border-radius: 6px;
      padding: 8px;
      font-size: 14px;
  }

  .obj-scroll-list .obj-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      cursor: pointer;
      border-bottom: 1px solid #38444d;
      transition: background 0.2s;
  }

  .obj-scroll-list .obj-item:hover {
      background: #1da1f2;
      color: #000;
  }

  .obj-scroll-list .obj-item:last-child {
      border-bottom: none;
  }

  .obj-scroll-list .obj-sym {
      font-weight: bold;
      color: #1da1f2;
      min-width: 20px;
      text-align: center;
  }

  .obj-scroll-list .obj-item.artifact {
      color: #ffdd00;               /* gold tint for artifacts */
  }

  .obj-scroll-list .obj-item.match {
      display: flex;
  }

  .obj-scroll-list .obj-item.no-match {
      display: none;
  }
</style>
</head>
<body>
<div id="menubar">
  <div class="toolbar-row" id="layer-brush-row">
    <button data-brush="terrain">Terrain</button>
    <button data-brush="light">Light</button>
    <button data-brush="dark">Dark</button>
    <button data-brush="monster">Monster</button>
    <button data-brush="object">Object</button>
  </div>
  <div class="toolbar-row" id="char-row"></div>
  <div class="toolbar-row" id="shape-row"></div>
  <div class="toolbar-row" id="fill-row"></div>
  <div class="toolbar-row" id="layer-show-hide-row">
    <button data-layer="terrain" class="selected">Terrain</button>
    <button data-layer="lighting">Lighting</button>
    <button data-layer="monster">Monster</button>
    <button data-layer="object">Object</button>
  </div>
  <div id="current-brush-label" style="margin: 8px 0; font-weight: bold; color: #1da1f2;">
      Selected brush: <span id="brush-display">None</span>
  </div>
</div>
<div id="main">
  <div id="left">
    <div style="position:relative;">
      <div id="grid"></div>
      <div id="overlay"></div>
    </div>

    <div id="position" style="white-space: pre-line; font-size: 14px; padding: 8px;">>Cursor: --,--</div>

  </div>
  <div id="right">
    <h3>Generated Lua Code</h3>
    <button id="copy-all-btn">Copy All Layers</button>
    <div id="terrain-code" class="layer-code">
      <h3>Terrain Layer</h3>
      <textarea id="terrain-textarea" readonly></textarea>
      <button onclick="copyLayer('terrain')">Copy Terrain</button>
      <button class="refresh" data-type="terrain" title="Regenerate Terrain LUA" style="margin-left: 8px; font-size: 18px;">♻</button>
    </div>
    
    <div id="lighting-code" class="layer-code ">
      <h3>Lighting Layer</h3>
      <textarea id="lighting-textarea" readonly></textarea>
      <button onclick="copyLayer('lighting')">Copy Lighting</button>
      <button class="refresh" data-type="lighting" title="Regenerate Lighting LUA" style="margin-left: 8px; font-size: 18px;">♻</button>
    </div>
    
    <div id="monster-code" class="layer-code ">
      <h3>Monster Layer</h3>
      <textarea id="monster-textarea" readonly></textarea>
      <button onclick="copyLayer('monster')">Copy Monsters</button>
      <button class="refresh" data-type="monsters" title="Regenerate Monsters LUA" style="margin-left: 8px; font-size: 18px;">♻</button>
    </div>
    
    <div id="object-code" class="layer-code ">
      <h3>Object Layer</h3>
      <textarea id="object-textarea" readonly></textarea>
      <button onclick="copyLayer('object')">Copy Objects</button>
      <button class="refresh" data-type="objects" title="Regenerate Objects LUA" style="margin-left: 8px; font-size: 18px;">♻</button>
    </div>
    
    
  </div>
</div>
<div id="popup-overlay">
  <div class="popup" id="monster-popup">
    <div class="mon-popup-layout">
    <div class="mon-input-section">
      <h3>Place Monster</h3>
      <label>Monster ID: <input id="mon-id" name="id" type="text" placeholder='e.g. "archangel" or "Gabriel"'></label>

      <label><input type="checkbox" name="peaceful"> Peaceful</label>
      <label><input type="checkbox" name="asleep"> Asleep</label>

      <label><input type="checkbox" id="mon-historic" name="historic"> Historic</label>
      <label>Force gender (check one if needed):</label>
      <label><input type="checkbox" name="male"> Male</label>
      <label><input type="checkbox" name="female"> Female</label>
      <label><input type="checkbox" name="neuter"> Neuter</label>

      <label>Custom name: <input type="text" name="name" placeholder='e.g. "Gabriel"'></label>

      <label>Inventory (Lua code):<br>
        <textarea id="mon-inventory" rows="6" name="inventory" placeholder="des.object({ id = &quot;club&quot; })\ndes.object(&quot;leather armor&quot;)"></textarea>
      </label>
      <button id='monster-confirm' >OK</button>
      <button id='monster-cancel' >Cancel</button>
      <!-- Monster eraser (same pattern) -->
      <button id="monster-eraser" class="palette-button" style="background: #400; color: #ff6666; font-weight: bold;">
          ERASER (removes monsters)
      </button>
    </div>
    <div id="mon-suggestions" class="mon-scroll-list">

    </div>
  </div>
  </div>
  
  <div class="popup hide" id="object-popup">
    <div class="obj-popup-layout">
    <div class="obj-input-section">
    <h3>Place Object</h3>

    <label>Object ID: <input id="obj-id" name="id" type="text" placeholder='e.g. "anointing oil" or "scroll of light"'></label>

    <label>BUC:</label>
    <div class="radio-group">
        <label><input type="radio" name="buc" value="blessed" id="buc-blessed"> Blessed</label>
        <label><input type="radio" name="buc" value="cursed" id="buc-cursed"> Cursed</label>
        <label><input type="radio" name="buc" value="uncursed" id="buc-cursed" checked> Uncursed</label>
        <label><input type="radio" name="buc" value="not-blessed" id="buc-uncursed"> Not Blessed</label>
        <label><input type="radio" name="buc" value="not-cursed" id="buc-uncursed"> Not Cursed</label>
    </div>
    
    <label>Charges (spe): <input type="number" name="spe" min="-10" max="20" value="0"></label>
    <label>Quantity: <input type="number" name="quan" min="1" value="1"></label>

    <label><input type="checkbox" name="trapped"> Trapped</label>
    <label><input type="checkbox" name="locked"> Locked</label>

    <label>Contents (for chests, Lua code):<br>
      <textarea id="obj-contents" name="contents" rows="6"></textarea>
    </label>

    <button id='object-confirm' >OK</button>
    <button id='object-cancel' >Cancel</button>
    <button id="object-eraser" class="palette-button" style="background: #400; color: #ff6666; font-weight: bold;">
        ERASER (removes objects)
    </button>

    </div>

    <div id="obj-suggestions" class="obj-scroll-list"></div>
</div>
  </div>
</div>
<script src="object_def.js"></script>
<script src="monster_def.js"></script>
<script src="terrain_def.js"></script>
<script src="color_def.js"></script>
<script>

let currentLayer = 'terrain'; // terrain, lighting, monster, object
let currentBrush = null; // null, 'light', 'dark', 'monster', 'object'
let pendingMonster = null; // {x,y} when popup waiting
let pendingObject = null;   // {x,y} when popup waiting
let currentMonsterBrush = null;     // the monster name/id that is currently selected
let currentObjectBrush = null;

const ROWS = 20;   // confirm from your grid-template-rows: repeat(20, ...)
const COLS = 76;   // confirm from grid-template-columns: repeat(76, ...)

const DARK_BG  = '#000000';        // totally black
const LIGHT_BG = '#0f0f0f';        // slightly brighter for lit cells

// 2D array to quick-access map cell elements (skip headers)
let mapCells = Array.from({length: ROWS}, () => Array(COLS));

const CELL_W = 16;
const CELL_H = 20;

let layers = {
  terrain: [],   // array of {char, x, y}
  lighting: [],  // array of {type:'lit'|'unlit', area:{x1,y1,x2,y2}}
  monster: [],  // array of monster configs
  object: []     // array of object configs
};
layers.terrain =  Array.from({length: ROWS}, () => Array(COLS).fill('stone'));
layers.lighting =  Array.from({length: ROWS}, () => Array(COLS).fill(null));
layers.monster =  Array.from({length: ROWS}, () => Array(COLS).fill(null));
layers.object =  Array.from({length: ROWS}, () => Array(COLS).fill(null));

let visibleLayers = {
  terrain: true,
  lighting: true,
  monster: true,
  object: true
};



let map = Array.from({length: ROWS}, () => Array(COLS).fill(' '));
let currentChar = ' ';
let currentShape = 'point';
let currentFillMode = 'solid';

let dragStart = null;
let currentHoverX = -1;
let currentHoverY = -1;

// === DEFAULTS FOR LUA OMISSION (add new keys here when you add new inputs) ===
const monsterDefaults = {
    peaceful: false,
    asleep: false,
    male: false,
    female: false,
    neuter: false,
    // name: '' (strings omitted when empty anyway)
    // add future booleans here with false
};

// === UPDATE objectDefaults (remove old blessed/cursed, add buc default) ===
const objectDefaults = {
    trapped: false,
    locked: false,
    spe: 0,
    quan: 1,
    buc: "uncursed",       // ← new default
    // ... any future defaults ...
};

const shapeButtons = [
  {id: 'point', label: 'Point'},
  {id: 'large', label: 'Large 4×4'},
  {id: 'rectangle', label: 'Rectangle'},
  {id: 'triangle', label: 'Triangle'},
  {id: 'circle', label: 'Circle'},
  {id: 'fill', label: 'Fill'},
];

const fillButtons = [
  {id: 'solid', label: 'Solid'},
  {id: 'outline', label: 'Outline'},
];

// === POPULATE AND FILTER THE MONSTER LIST ===
let monListItems = []; // will hold pre-created DOM elements for performance
let objListItems = []; // pre-created DOM elements for performance

// === Helper: update the label that shows the current brush ===
function updateBrushLabel() {
    let text = "None";
    if (currentBrush === 'terrain' && currentTerrain) {
        text = `Terrain: ${allTerrains[currentTerrain].id}`;
    } else if (currentBrush === 'object') {
        text = currentObjectBrush ? `Object: ${currentObjectBrush.id}` : "Object: ERASER";
    } else if (currentBrush === 'monster') {
        text = currentMonsterBrush ? `Monster: ${currentMonsterBrush.id}` : "Monster: ERASER";
    } else if (currentBrush) {
        text = currentBrush.charAt(0).toUpperCase() + currentBrush.slice(1);
    }
    document.getElementById('brush-display').textContent = text;
}

// === Helper: select a brush mode (terrain / object / monster) ===
function selectBrush(mode) {
    if (currentBrush === mode) return; // already selected

    currentBrush = mode;

    // Update .selected class on mode buttons (adjust selector if yours is different)
    document.querySelectorAll('[data-brush]').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.brush === mode);
    });

}



function populateMonsterList(filter = '') {
    const list = document.getElementById('mon-suggestions');
    if (list.children.length === 0) {
        // First time: create all items once
        const sortedNames = Object.keys(allMonsters).sort((a, b) => a.localeCompare(b));
        sortedNames.forEach(name => {
            const item = document.createElement('div');
            const thisMonster = allMonsters[name];
            item.className = 'mon-item';
            item.textContent = thisMonster.id;
            item.dataset.name = name;
            
            

            item.addEventListener('click', () => {
                document.getElementById('mon-id').value = thisMonster.id;
                // Optional: auto-scroll selected item into view
                item.scrollIntoView({ block: 'nearest' });
                // Keep focus on input for further typing if desired
                document.getElementById('mon-id').focus();
            });

            list.appendChild(item);
            monListItems.push(item);
        });
    }

    // Always filter (even on first populate with empty filter)
    const lowerFilter = filter.toLowerCase();
    monListItems.forEach(item => {
        const name = item.dataset.name;
        if (name.includes(lowerFilter)) {
            item.classList.remove('no-match');
            item.classList.add('match');
        } else {
            item.classList.remove('match');
            item.classList.add('no-match');
        }
    });
}

function populateObjectList(filter = '') {
    const list = document.getElementById('obj-suggestions');
    if (list.children.length === 0) {
        // First open: create all items once, sorted alphabetically
        const sortedNames = Object.keys(allObjects).sort((a, b) => a.localeCompare(b));
        sortedNames.forEach(name => {
            const obj = allObjects[name];
            const item = document.createElement('div');
            item.className = 'obj-item' + (obj.is_artifact ? ' artifact' : '');
            item.dataset.name = name;

            const symSpan = document.createElement('span');
            symSpan.className = 'obj-sym';
            symSpan.textContent = obj.symbol;

            const nameSpan = document.createElement('span');
            nameSpan.textContent = name;

            item.appendChild(symSpan);
            item.appendChild(nameSpan);

            item.addEventListener('click', () => {
                document.getElementById('obj-id').value = name;
                item.scrollIntoView({ block: 'nearest' });
                document.getElementById('obj-id').focus();
            });

            list.appendChild(item);
            objListItems.push(item);
        });
    }

    // Filter (case-insensitive includes)
    const lowerFilter = filter.toLowerCase();
    objListItems.forEach(item => {
        const name = item.dataset.name;
        if (name.includes(lowerFilter)) {
            item.classList.remove('no-match');
            item.classList.add('match');
        } else {
            item.classList.remove('match');
            item.classList.add('no-match');
        }
    });
}



// Deselect all char buttons when layer brush selected, and vice versa
function deselectAllChars() {
  document.querySelectorAll('#char-row button.selected').forEach(b => b.classList.remove('selected'));
  currentChar = null;
}

function deselectAllBrushes() {
  document.querySelectorAll('#layer-brush-row button.selected').forEach(b => b.classList.remove('selected'));
  currentBrush = null;
}

// === CREATURE CONFIRM HANDLER (replace existing monster-confirm handler) ===
// === UPDATED CONFIRM HANDLERS ===
document.getElementById('monster-confirm').addEventListener('click', () => {
    const brush = collectBrushFromPopup('#monster-popup');
    if (!brush) return;

    selectBrush('monster');
    currentMonsterBrush = brush;
    updateBrushLabel();

    document.querySelectorAll('.toolbar-row button[data-brush]').forEach(b => b.classList.remove('selected'));
    currentBrush = 'monster';
    document.querySelector('button[data-brush="monster"]').classList.add('selected');

    hideMonsterPopup();
    renderLayers();
});



// === CREATURE CANCEL (unchanged except clearing inputs is optional) ===
document.getElementById('monster-cancel').addEventListener('click', () => {
    hideMonsterPopup();
    // leaves currentMonsterBrush intact – user keeps last selection
});

// === OBJECT CONFIRM HANDLER (replace your existing object-confirm click handler) ===
document.getElementById('object-confirm').addEventListener('click', () => {
    const brush = collectBrushFromPopup('#object-popup');
    if (!brush) return;
    selectBrush('object');
    currentObjectBrush = brush;
    updateBrushLabel();
    

    document.querySelectorAll('.toolbar-row button[data-brush]').forEach(b => b.classList.remove('selected'));
    currentBrush = 'object';
    document.querySelector('button[data-brush="object"]').classList.add('selected');

    hideObjectPopup();
    renderLayers();
});

// === OBJECT CANCEL HANDLER (unchanged except hide) ===
document.getElementById('object-cancel').addEventListener('click', () => {
    hideObjectPopup();
    // leaves currentObjectBrush unchanged so user keeps last selection
});

// === RE-WRITTEN BRUSH BUTTON HANDLER ===
document.querySelectorAll('.toolbar-row button[data-brush]').forEach(btn => {
    btn.addEventListener('click', function () {
        const brush = this.dataset.brush;

        // ----- Determine which layer we are editing (keeps your original logic) -----
        let layer = brush;
        switch (brush) {
            case 'terrain':
            case 'monster':
            case 'object':
                layer = brush;
                break;
            case 'light':
            case 'dark':
                layer = 'lighting';
                break;
            default:
                layer = 'terrain';
        }
        currentLayer = layer;
        visibleLayers[currentLayer] = true;

        // ----- Remove highlight from every brush button -----
        document.querySelectorAll('.toolbar-row button[data-brush]').forEach(b =>
            b.classList.remove('selected')
        );

        // ----- Special modal brushes (monster & object) -----
        if (brush === 'monster') {
            hideObjectPopup();
            showMonsterPopup();
            document.getElementById('mon-id').value = currentMonsterBrush || '';
            document.getElementById('mon-id').focus();
            return;                                      // do NOT highlight yet
        }

        if (brush === 'object') {
            hideMonsterPopup();
            showObjectPopup();

            return;                                      // do NOT highlight yet
        }

        // ----- All other brushes (terrain, light, dark, etc.) -----
        currentBrush = brush;
        currentMonsterBrush = null;
        currentObjectBrush = null;
        this.classList.add('selected');
        hideMonsterPopup();
        hideObjectPopup();
    });
});

// === UPDATE showMonsterPopup() (replace your existing version) ===
// === UPDATED SHOW POPUP FUNCTIONS ===
function showMonsterPopup() {
    document.getElementById('monster-popup').parentNode.style.display = 'flex';
    prefillPopupFromBrush('#monster-popup', currentMonsterBrush);

    // Populate/full list on open
    populateMonsterList('');

    // Focus input and select its content for easy replacement
    document.getElementById('monster-popup').classList.remove('hide');
    const input = document.querySelector('#monster-popup [name="id"]');
    input.focus();
    input.select();
}

// === FILTER ON INPUT ===
document.getElementById('mon-id').addEventListener('input', (e) => {
    const filter = e.target.value.trim();
    populateMonsterList(filter);
});


function hideMonsterPopup() {
    document.getElementById('monster-popup').parentNode.style.display = 'none';
    document.getElementById('monster-popup').classList.add('hide');
}

// === UPDATE showObjectPopup() TO INITIALIZE THE LIST ===
function showObjectPopup() {
    document.getElementById('object-popup').parentNode.style.display = 'flex';
    prefillPopupFromBrush('#object-popup', currentObjectBrush);

    // Full list on open
    populateObjectList('');

    document.getElementById('object-popup').classList.remove('hide');

    const input = document.querySelector('#object-popup [name="id"]');
    input.focus();
    input.select();
}

// === FILTER ON INPUT ===
document.getElementById('obj-id').addEventListener('input', (e) => {
    const filter = e.target.value.trim();
    populateObjectList(filter);
});


function hideObjectPopup() {
    document.getElementById('object-popup').parentNode.style.display = 'none';
    document.getElementById('object-popup').classList.add('hide');
}


// Modify existing char-row clicks to deselect brushes
// (add to each char button click: deselectAllBrushes(); )
// === 1. Auto-select terrain mode when a terrain char button is clicked ===
// Assuming your terrain symbol buttons have class "terrain-char" and data-terrain attribute
const charRow = document.getElementById('char-row');
Object.keys(allTerrains).forEach(key => {
  const terr = allTerrains[key];
  const b = document.createElement('button');
  b.textContent = terr.lua === ' ' ? '[space]' : terr.lua;

// === UPDATE collectBrushFromPopup() TO HANDLE RADIO BUTTONS ===
function collectBrushFromPopup(popupSelector) {
    const inputs = document.querySelectorAll(`${popupSelector} [name]`);
    const brush = {};

    let idSet = false;

    // First pass: collect radio groups (only the checked one)
    const radioNames = new Set();
    inputs.forEach(input => {
        if (input.type === 'radio') radioNames.add(input.name);
    });

    radioNames.forEach(name => {
        const checked = document.querySelector(`${popupSelector} [name="${name}"]:checked`);
        if (checked) {
            brush[name] = checked.value;
        }
    });

    // Second pass: everything else (checkboxes, text, number)
    inputs.forEach(input => {
        if (input.type === 'radio') return; // already handled

        let val;
        if (input.type === 'checkbox') {
            val = input.checked;
        } else if (input.type === 'number') {
            val = input.value === '' ? 0 : Number(input.value);
        } else {
            val = input.value.trim();
        }

        if (input.name === 'id') {
            if (val) idSet = true;
            else return; // abort if no id
        }

        // Store non-default-like values; always store booleans/numbers for correct pre-fill
        if (val !== '' && val !== false && val !== null && val !== undefined) {
            brush[input.name] = val;
        } else if (input.type === 'checkbox') {
            brush[input.name] = false;
        } else if (input.type === 'number') {
            brush[input.name] = 0;
        }
    });

    // Ensure buc has a value (fallback to default if somehow missing)
    if (!brush.hasOwnProperty('buc')) brush.buc = "uncursed";

    if (!idSet) {
        alert('ID is required.');
        return null;
    }

    return brush;
}

// === UPDATE prefillPopupFromBrush() TO HANDLE RADIO BUTTONS ===
function prefillPopupFromBrush(popupSelector, brush) {
    const inputs = document.querySelectorAll(`${popupSelector} [name]`);

    inputs.forEach(input => {
        const key = input.name;

        if (input.type === 'radio') {
            // Check the radio that matches the stored value (or default)
            const targetValue = (brush && brush[key]) || (key === 'buc' ? 'uncursed' : '');
            input.checked = (input.value === targetValue);
        } else if (input.type === 'checkbox') {
            input.checked = !!(brush && brush[key]);
        } else if (input.type === 'number') {
            input.value = (brush && brush.hasOwnProperty(key)) ? brush[key] : (input.getAttribute('value') || '0');
        } else {
            input.value = (brush && brush[key]) || '';
        }
    });
}

// === generateObjectLUA() FUNCTION ===
function generateObjectLUA() {
    let lua = '';

    for (let y = 0; y < 20; y++) {
        for (let x = 0; x < 76; x++) {
            const obj = layers.object[y][x];
            if (!obj || !obj.id) continue;

            const props = [];
            for (const key in obj) {
                if (key === 'id') continue;

                const val = obj[key];
                const def = objectDefaults[key];

                if (val === def || val === '' || val === false && def === false) continue;

                if (typeof val === 'boolean') {
                    if (val === (objectDefaults[key] ?? false)) continue;  // omit default (false → nothing)
                    props.push(`${key} = ${val ? 1 : 0}`);                   // checked → = 1, unchecked but non-default → = 0
                } else if (typeof val === 'string' && val) {
                    props.push(`${key} = "${val.replace(/"/g, '\\"')}"`);
                } else if (typeof val === 'number') {
                    if (key === 'spe' && val === 0) continue;          // spe 0 is default
                    if (key === 'quan' && val === 1) continue;         // quantity 1 is default
                    props.push(`${key} = ${val}`);
                }
            }

            let line = `des.object({ id = "${obj.id}", x = ${x + 1}, y = ${y + 1}`;
            if (props.length) line += ', ' + props.join(', ');
            line += ' })\n';
            lua += line;
        }
    }
    return lua;
}

// === generateLightLUA() FUNCTION ===
function generateLightLUA() {
    if (!layers.lighting || layers.lighting.length === 0) return '';

    const rows = layers.lighting.length;
    const cols = layers.lighting[0].length;

    const pad = n => String(n).padStart(2, '0');

    // Helper: cover a binary grid (true = needs this tag) with maximal rectangles
    function getCoveringRects(tagGrid) {  // tagGrid is boolean[][]
        const rects = [];
        const remaining = tagGrid.map(row => row.slice());  // clone

        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; ) {
                if (!remaining[y][x]) {
                    x++;
                    continue;
                }

                // extend right as far as possible on this row
                let x2 = x;
                while (x2 + 1 < cols && remaining[y][x2 + 1]) x2++;

                // extend down as far as possible while keeping the full width
                let y2 = y;
                while (y2 + 1 < rows) {
                    let good = true;
                    for (let xx = x; xx <= x2; xx++) {
                        if (!remaining[y2 + 1][xx]) {
                            good = false;
                            break;
                        }
                    }
                    if (good) y2++;
                    else break;
                }

                // record the rectangle
                rects.push({ x1: x, y1: y, x2, y2 });

                // mark all cells in this rectangle as covered
                for (let yy = y; yy <= y2; yy++) {
                    for (let xx = x; xx <= x2; xx++) {
                        remaining[yy][xx] = false;
                    }
                }

                // skip past this rectangle
                x = x2 + 1;
            }
        }
        return rects;
    }

    // Rectangles needed if we treat "lit" cells as the ones to explicitly cover
    const litRects = getCoveringRects(layers.lighting);  // assumes true = lit

    // Rectangles needed if we treat "unlit" cells as the ones to explicitly cover
    const unlitGrid = layers.lighting.map(row => row.map(cell => !cell));
    const unlitRects = getCoveringRects(unlitGrid);

    // Option 1: whole map lit, override with unlit rectangles
    const optionLitBg = [
        `des.region(selection.area(${pad(0)},${pad(0)},${pad(cols-1)},${pad(rows-1)}), "lit")`
    ];
    for (const r of unlitRects) {
        optionLitBg.push(`des.region(selection.area(${pad(r.x1)},${pad(r.y1)},${pad(r.x2)},${pad(r.y2)}), "unlit")`);
    }

    // Option 2: whole map unlit, override with lit rectangles
    const optionUnlitBg = [
        `des.region(selection.area(${pad(0)},${pad(0)},${pad(cols-1)},${pad(rows-1)}), "unlit")`
    ];
    for (const r of litRects) {
        optionUnlitBg.push(`des.region(selection.area(${pad(r.x1)},${pad(r.y1)},${pad(r.x2)},${pad(r.y2)}), "lit")`);
    }

    // Choose the option with fewer statements
    const chosen = optionLitBg.length <= optionUnlitBg.length ? optionLitBg : optionUnlitBg;

    return chosen.join('\n');
}

function paint(x, y) {

    layers.terrain[y][x] = currentChar;

  } else if (currentBrush === 'light' || currentBrush === 'dark') {
    // Simple rectangle region for lit/unlit
    if (!dragStart) return;
    const x1 = Math.min(dragStart.x, x), x2 = Math.max(dragStart.x, x);
    const y1 = Math.min(dragStart.y, y), y2 = Math.max(dragStart.y, y);
    const type = currentBrush === 'light' ? 'lit' : 'unlit';

    for (let yy = y1; yy <= y2; yy++) {
      layers.lighting[yy].fill(type, x1, x2 + 1);
    }

    //layers.lighting.push({type, area: {x1,y1,x2,y2}});
  } else if (currentBrush === 'monster') {
        if (currentMonsterBrush === null) {
          layers.monster[y][x] = null;   // or ''
        } else {
          // Clone so later popup changes don't affect already-placed monsters
          layers.monster[y][x] = { ...currentMonsterBrush };   // spread clone
        }

  } // === UPDATE paint() FOR OBJECTS (replace the object branch) ===
  else if (currentBrush === 'object') {
    if (currentObjectBrush === null) {
        layers.objects[y][x] = null;   // or '' depending on how you store empty
    } else {
      // Clone the template so future brush changes don't affect already-placed objects
      layers.object[y][x] = { ...currentObjectBrush };
    }
  }

}

function drawRectangle(xmin, xmax, ymin, ymax) {
  if (currentFillMode === 'solid') {
    for (let y = ymin; y <= ymax; y++)
      for (let x = xmin; x <= xmax; x++) paint(x, y);
  } else {
    for (let x = xmin; x <= xmax; x++) { paint(x, ymin); paint(x, ymax); }
    for (let y = ymin + 1; y < ymax; y++) { paint(xmin, y); paint(xmax, y); }
  }
}

function drawCircle(xmin, xmax, ymin, ymax) {
  const cx = (xmin + xmax) / 2;
  const cy = (ymin + ymax) / 2;
  const rx = (xmax - xmin) / 2 + 0.5;
  const ry = (ymax - ymin) / 2 + 0.5;
  if (rx <= 0 || ry <= 0) return;

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const dx = (x - cx) / rx;
      const dy = (y - cy) / ry;
      const dist = dx * dx + dy * dy;
      if (currentFillMode === 'solid') {
        if (dist <= 1) paint(x, y);
      } else {
        if (Math.abs(dist - 1) < 0.35) paint(x, y); // slightly thicker for visibility
      }
    }
  }
}

function drawTriangle(xmin, xmax, ymin, ymax) {
  if (currentFillMode === 'solid') {
    for (let y = ymin; y <= ymax; y++) {
      const t = (y - ymin) / (ymax - ymin || 1);
      const rowX = Math.round(xmin + t * (xmax - xmin));
      for (let x = rowX; x <= xmax; x++) paint(x, y);
    }
  } else { // outline: top, right, hypotenuse
    // top horizontal
    for (let x = xmin; x <= xmax; x++) paint(x, ymin);
    // right vertical
    for (let y = ymin; y <= ymax; y++) paint(xmax, y);
    // hypotenuse (approximate)
    for (let y = ymin; y <= ymax; y++) {
      const t = (y - ymin) / (ymax - ymin || 1);
      const hx = Math.round(xmin + t * (xmax - xmin));
      paint(hx, y);
    }
  }
}

function applyShape(x1, y1, x2, y2) {
  const xmin = Math.max(0, Math.min(x1, x2));
  const xmax = Math.min(COLS - 1, Math.max(x1, x2));
  const ymin = Math.max(0, Math.min(y1, y2));
  const ymax = Math.min(ROWS - 1, Math.max(y1, y2));

  if (xmax < xmin || ymax < ymin) return;

  if (currentShape === 'rectangle') drawRectangle(xmin, xmax, ymin, ymax);
  else if (currentShape === 'circle') drawCircle(xmin, xmax, ymin, ymax);
  else if (currentShape === 'triangle') drawTriangle(xmin, xmax, ymin, ymax);
}

function fillArea(startX, startY) {
  const target = map[startY][startX];
  if (target === currentChar) return;

  const queue = [[startX, startY]];
  const visited = Array.from({length: ROWS}, () => Array(COLS).fill(false));

  while (queue.length) {
    const [cx, cy] = queue.shift();
    if (cx < 0 || cx >= COLS || cy < 0 || cy >= ROWS || visited[cy][cx] || map[cy][cx] !== target) continue;
    visited[cy][cx] = true;
    paint(cx, cy);
    queue.push([cx-1, cy], [cx+1, cy], [cx, cy-1], [cx, cy+1]);
  }
}

function renderLayers() {
  // Helper to convert a color token (e.g. "CLR_RED", "HI_DOMESTIC", "NO_COLOR") to an rgb() string
  function getColorRGB(token) {
    // "None" appears in a few object entries – treat it the same as missing/NO_COLOR
    if (!token || token === "None" || token === "NO_COLOR") {
      return "#ffffff"; // bright white – safe default for uncolored things
    }
    const entry = colorTable[token];
    if (entry && entry.RGB) {
      return `rgb(${entry.RGB.r}, ${entry.RGB.g}, ${entry.RGB.b})`;
    }
    // Fallback for any unknown token
    return "#ffffff";
  }

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const cell = mapCells[y][x];
      if (!cell) continue;

      let displayChar = ' ';
      let displayColor = "#ffffff"; // default foreground (white)
      let displayLight = DARK_BG;

      // ----- Terrain layer (base) -----
      if (visibleLayers.terrain && layers.terrain[y][x]) {
        const terrId = layers.terrain[y][x];
        const terr = allTerrains[terrId] || allTerrains["stone"]; // safe fallback
        displayChar = terr.symbol || ' ';
        displayColor = getColorRGB(terr.color);
      }

      // ----- Object layer (overrides terrain char + color) -----
      if (visibleLayers.object && layers.object[y][x]) {
        const objId = layers.object[y][x].id.toLowerCase();
        const obj = allObjects[objId];
        if (obj) {
          // Use the symbol you already have from getObjectChar if you prefer,
          // but allObjects now contains the correct symbol directly
          displayChar = obj.symbol || '?';
          if (obj.color) {
            displayColor = getColorRGB(obj.color);
          }
          // If the object has no explicit color, keep the terrain color underneath
        }
      }

      // ----- Monster/Monster layer (overrides object char + color) -----
      if (visibleLayers.monster && layers.monster[y][x]) {
        const monId = layers.monster[y][x].id.toLowerCase();
        const mon = allMonsters[monId];
        if (mon) {
          displayChar = mon.symbol || 'm';
          if (mon.color) {
            displayColor = getColorRGB(mon.color);
          }
          // If the monster has no explicit color, keep the previous layer's color
        }
      }

      // ----- Lighting layer (background only) -----
      if (visibleLayers.lighting) {
        displayLight = layers.lighting[y][x] === 'lit' ? LIGHT_BG : DARK_BG;
      }

      // ----- Final render to the cell -----
      cell.textContent = displayChar;
      cell.style.color = displayColor;         // foreground (uses color_def.js)
      cell.style.backgroundColor = displayLight;
    }
  }
}

// === UPDATE getObjectChar() TO WORK WITH STRUCTURED OBJECTS ===
function getObjectChar(input) {
    let id = '';

    if (typeof input === 'object' && input !== null && input.id) {
        id = input.id.trim().toLowerCase();            // structured monster from layers.monster
    } else if (typeof input === 'string') {
        id = input.trim().toLowerCase();                // legacy string fallback
    }

    if (!id) return '?';

    // Direct lookup in the canonical allMonsters table generated from the fork
    const monster = allObjects[id];

    // Return the exact symbol defined in defsym.h for this monster (via monsters.h mapping)
    return monster ? monster.symbol : '?';             // fallback to generic 'm' if unknown
}

// === getMonsterChar() USING allMonsters ===
function getMonsterChar(input) {
    let id = '';

    if (typeof input === 'object' && input !== null && input.id) {
        id = input.id.trim().toLowerCase();            // structured monster from layers.monster
    } else if (typeof input === 'string') {
        id = input.trim().toLowerCase();                // legacy string fallback
    }

    if (!id) return 'm';

    // Direct lookup in the canonical allMonsters table generated from the fork
    const monster = allMonsters[id];

    // Return the exact symbol defined in defsym.h for this monster (via monsters.h mapping)
    return monster ? monster.symbol : 'm';             // fallback to generic 'm' if unknown
}
